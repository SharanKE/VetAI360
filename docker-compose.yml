services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ml_models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-vetai360_change_me_in_production}
      JWT_EXPIRES_IN: 7d
      DB_TYPE: mongo
      MONGODB_URI: mongodb://mongodb:27017/vetai360
      MONGO_DB_NAME: vetai360
      ML_SERVICE_URL: http://ml-service:8000
      CLIENT_ORIGIN: http://localhost:5173,http://localhost:5174,http://localhost:5175
      SENSOR_SIMULATION_INTERVAL_MS: 8000
    ports:
      - "5000:5000"
    command: sh -c "node utils/seed.js && node server.js"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo_data:
  ml_models:
