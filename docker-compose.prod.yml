# Production stack — uses MongoDB Atlas (external) instead of a local mongo container.
# Set MONGODB_URI in .env.prod or export before running:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build

services:
  ml-service:
    build: ./ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      ml-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod}
      JWT_EXPIRES_IN: 7d
      DB_TYPE: mongo
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI to your Atlas connection string}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-vetai360}
      ML_SERVICE_URL: http://ml-service:8000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      SEED_ON_START: ${SEED_ON_START:-true}
      SENSOR_SIMULATION_INTERVAL_MS: 8000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
